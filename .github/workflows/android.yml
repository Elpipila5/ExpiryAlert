name: Android CI

on:
  push:
    branches: [main, v21]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
      - '.github/scripts/pruebas-android.sh'
      - 'scripts/**'
      - 'Actualizar-ExpiryAlert.cmd'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
      - '.github/scripts/pruebas-android.sh'
      - 'scripts/**'
      - 'Actualizar-ExpiryAlert.cmd'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instalador:
    name: Actualizacion desde Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Revisar sintaxis y ejecutar diagnostico
        shell: powershell
        run: |
          $errores = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'scripts/Actualizar-ExpiryAlert.ps1'), [ref]$tokens, [ref]$errores) | Out-Null
          if ($errores.Count -gt 0) { $errores | Format-List; exit 1 }
          & .\Actualizar-ExpiryAlert.cmd -SoloDiagnostico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Preparar pruebas locales
        run: |
          cat > "$RUNNER_TEMP/pruebas-expiry.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(Test).configureEach {
                  executable = System.getenv('JAVA_HOME_21_X64') + '/bin/java'
                  systemProperty('robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2')
              }
          }
          GRADLE
      - name: Compilar, probar y revisar lint
        run: >
          bash gradlew :app:testDebugUnitTest :app:assembleDebug
          :app:assembleDebugAndroidTest :app:lintDebug
          --no-daemon --max-workers=3
          -I "$RUNNER_TEMP/pruebas-expiry.gradle"
          -Dorg.gradle.jvmargs=-Xmx3g
      - name: Guardar informes y capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-android
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v7
        with:
          name: ExpiryAlert-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  android:
    name: Pruebas en Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compilar APK de aplicación y pruebas
        run: >
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g
      - name: Ejecutar pruebas instrumentadas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/pruebas-android.sh
      - name: Guardar resultados de Android
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pruebas-android-15
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/diseno-android/
          retention-days: 7
