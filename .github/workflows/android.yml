name: Android CI

on:
  push:
    branches: [main, feature/diseno-y-personalizacion]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Preparar pruebas locales
        run: |
          cat > "$RUNNER_TEMP/pruebas-expiry.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(Test).configureEach {
                  executable = System.getenv('JAVA_HOME_21_X64') + '/bin/java'
                  systemProperty('robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2')
              }
          }
          GRADLE
      - name: Compilar, probar y revisar lint
        run: >
          bash gradlew :app:testDebugUnitTest :app:assembleDebug
          :app:assembleDebugAndroidTest :app:lintDebug
          --no-daemon --max-workers=3
          -I "$RUNNER_TEMP/pruebas-expiry.gradle"
          -Dorg.gradle.jvmargs=-Xmx3g
      - name: Guardar informes y capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-android
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v7
        with:
          name: ExpiryAlert-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
